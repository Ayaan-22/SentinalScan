name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt
            ruff.toml

      - name: Install backend test dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check backend/

      - name: Security scan (bandit)
        run: python -m bandit -r backend/app/ -ll --skip B101

      - name: Compile
        run: cd backend && python -m compileall -q app

      - name: Run tests
        env:
          SENTINAL_API_KEY: ${{ secrets.SENTINAL_API_KEY || 'ci_test_key_abcdefghijklmnop12345678' }}
        run: |
          cd backend
          python -m pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint (ESLint)
        run: cd frontend && npm run lint --if-present

      - name: Run tests
        run: cd frontend && npm test

      - name: Build
        run: cd frontend && npm run build
        env:
          VITE_API_URL: http://localhost:8000/api/v1
          VITE_WS_URL: ws://localhost:8000
